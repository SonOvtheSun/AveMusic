server:
  address: ${FILE_SERVICE_HOST:127.0.0.1}
  port: ${FILE_SERVICE_PORT:8090}

spring:
  application:
    name: avemusic-file-service

  servlet:
    multipart:
      enabled: true
      max-file-size: 300MB
      max-request-size: 310MB
      file-size-threshold: 0B

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD}

avemusic:
  file:
    root: ${AVEMUSIC_FILE_ROOT:D:/AveMusic/storage}
    public-base-url: ${AVEMUSIC_FILE_PUBLIC_BASE_URL:http://localhost:8090}
    internal-token: ${AVEMUSIC_FILE_INTERNAL_TOKEN}
